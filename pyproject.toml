[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-home-cinema"
version = "0.6.0-alpha"
description = "Intelligent Windows Home Cinema Runtime"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "psutil>=7.0.0",
]

authors = [
    { name = "Richard Nelson" }
]

[project.scripts]
orion = "main:main"