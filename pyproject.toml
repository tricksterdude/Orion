[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-home-cinema"
version = "0.6.0-alpha"
description = "Intelligent Windows Home Cinema Runtime"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "Flask>=3.1.0",
    "psutil>=7.0.0",
    "requests>=2.32.0",
    "websocket-client>=1.8.0",
]

authors = [
    { name = "Richard Nelson" }
]

[project.scripts]
orion = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]