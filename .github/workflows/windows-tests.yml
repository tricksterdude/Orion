name: Windows tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    name: Safe regression suite
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out Orion
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app tests

      - name: Run safe regression tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = $PWD.Path

          $tests = @(
            "tests/test_docker_cli.py",
            "tests/test_ffprobe_cli.py",
            "tests/test_single_instance.py",
            "tests/test_system_diagnostics.py",
            "tests/test_secure_settings.py",
            "tests/test_settings_page.py",
            "tests/test_local_configuration.py",
            "tests/test_setup_profile.py",
            "tests/test_setup_page.py",
            "tests/test_provider_selection.py",
            "tests/test_diagnostics_page.py",
            "tests/test_home_page.py",
            "tests/test_service_status.py",
            "tests/test_stremio_controller.py",
            "tests/test_aiostreams_playback.py",
            "tests/test_playback_history.py",
            "tests/test_playback_cycle.py",
            "tests/test_runtime_recovery.py",
            "tests/test_service_details_page.py",
            "tests/test_aiostreams_template_updates.py",
            "tests/test_aiostreams_template_routes.py",
            "tests/test_service_discovery.py"
          )

          foreach ($test in $tests) {
            Write-Host "Running $test"
            & python $test

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
